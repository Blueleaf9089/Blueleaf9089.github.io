<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My site ig</title>

<style>
:root {
  --a: cyan;
  --b: magenta;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  cursor: none;
}

body {
  height: 100vh;
  overflow: hidden;
  background: black;
  color: white;
  font-family: monospace;
}

/* CURSOR */
#cursor {
  position: fixed;
  width: 18px;
  height: 18px;
  border: 2px solid var(--a);
  border-radius: 50%;
  pointer-events: none;
  box-shadow: 0 0 15px var(--a);
  z-index: 9999;
}

/* FLOATING EMOJIS */
.emoji {
  position: absolute;
  font-size: 24px;
  animation: floatUp linear infinite;
}

@keyframes floatUp {
  from { transform: translateY(100vh); opacity: 1; }
  to { transform: translateY(-10vh); opacity: 0; }
}

/* CENTER PANEL */
.panel {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.8);
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 0 80px var(--a);
  text-align: center;
  animation: breathe 4s infinite;
}

@keyframes breathe {
  0% { box-shadow: 0 0 30px var(--a); }
  50% { box-shadow: 0 0 90px var(--b); }
  100% { box-shadow: 0 0 30px var(--a); }
}

h1 {
  font-size: 3rem;
  background: linear-gradient(90deg, var(--a), var(--b));
  -webkit-background-clip: text;
  color: transparent;
}

button {
  margin: 10px;
  padding: 12px 22px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(90deg, var(--b), var(--a));
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.2) rotate(-3deg);
}

/* SHAKE SCREEN */
.shake {
  animation: shake 0.1s infinite;
}

@keyframes shake {
  0% { transform: translate(0,0); }
  25% { transform: translate(5px,0); }
  50% { transform: translate(-5px,0); }
  75% { transform: translate(0,5px); }
  100% { transform: translate(0,0); }
}

/* PROGRESS BAR */
#bar {
  margin-top: 20px;
  height: 8px;
  width: 0%;
  background: var(--a);
  transition: width 0.3s;
}
</style>
</head>

<body>

<div id="cursor"></div>

<div class="panel" id="panel">
  <h1>WHY 😈</h1>
  <p>this website has too much going on</p>

  <button onclick="spawn()">SPAM EMOJIS</button>
  <button onclick="colors()">RANDOM COLORS</button>
  <button onclick="shake()">SCREEN SHAKE</button>
  <button onclick="charge()">CHARGE BAR</button>

  <div id="bar"></div>
</div>

<script>
// CURSOR
const cursor = document.getElementById("cursor");
document.addEventListener("mousemove", e => {
  cursor.style.left = e.clientX + "px";
  cursor.style.top = e.clientY + "px";
});

// EMOJI SPAWNER
const emojis = ["🔥","😈","💀","⚡","👁️","🧠"];
function spawn() {
  for (let i = 0; i < 15; i++) {
    const e = document.createElement("div");
    e.className = "emoji";
    e.innerText = emojis[Math.floor(Math.random()*emojis.length)];
    e.style.left = Math.random()*100 + "vw";
    e.style.animationDuration = (Math.random()*3+2)+"s";
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 5000);
  }
}

// COLOR RANDOMIZER
function colors() {
  document.documentElement.style.setProperty("--a", `hsl(${Math.random()*360},100%,50%)`);
  document.documentElement.style.setProperty("--b", `hsl(${Math.random()*360},100%,50%)`);
}

// SCREEN SHAKE
function shake() {
  document.body.classList.toggle("shake");
  setTimeout(()=>document.body.classList.remove("shake"), 800);
}

// FAKE LOADING BAR
let progress = 0;
function charge() {
  progress = 0;
  const bar = document.getElementById("bar");
  const i = setInterval(()=>{
    progress += Math.random()*15;
    bar.style.width = Math.min(progress,100)+"%";
    if (progress >= 100) clearInterval(i);
  },200);
}

// SECRET KEY
document.addEventListener("keydown", e=>{
  if (e.key === "g") alert("SECRET KEY ACTIVATED 👁️");
});
</script>

</body>
</html>
