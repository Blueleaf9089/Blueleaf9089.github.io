<!DOCTYPE html>
<html>
<head>
<title>My Insane Website</title>
<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(270deg, #ff00cc, #3333ff);
  background-size: 400% 400%;
  animation: bgMove 10s infinite alternate;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
}

@keyframes bgMove {
  0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}

.card {
  background: black;
  color: white;
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 0 30px #ff00cc;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0); }
}

button {
  margin-top: 20px;
  padding: 12px 20px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: #ff00cc;
  color: white;
}
</style>
</head>

<body>
  <div class="card">
    <h1>HELLO INTERNET 😈</h1>
    <p>This site is ALIVE.</p>
    <button onclick="goCrazy()">CLICK ME</button>
  </div>

<script>
function goCrazy() {
  alert("YOU JUST ACTIVATED THE WEBSITE 🔥🔥🔥");
}
</script>
</body>
</html>
