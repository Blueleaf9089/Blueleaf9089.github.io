<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ABSOLUTE INTERNET UNIT</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #0f2027, #000);
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
  color: white;
}

/* BACKGROUND PARTICLES */
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  opacity: 0.7;
  animation: fall linear infinite;
}

@keyframes fall {
  from { transform: translateY(-10vh); }
  to { transform: translateY(110vh); }
}

/* CENTER CARD */
.container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.7);
  padding: 50px;
  border-radius: 25px;
  box-shadow: 0 0 40px cyan;
  text-align: center;
  animation: pulse 4s infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 20px cyan; }
  50% { box-shadow: 0 0 60px magenta; }
  100% { box-shadow: 0 0 20px cyan; }
}

h1 {
  font-size: 3rem;
  background: linear-gradient(90deg, cyan, magenta);
  -webkit-background-clip: text;
  color: transparent;
}

p {
  opacity: 0.85;
}

button {
  margin-top: 20px;
  padding: 15px 30px;
  font-size: 1.1rem;
  border: none;
  border-radius: 12px;
  background: linear-gradient(90deg, magenta, cyan);
  color: black;
  cursor: pointer;
  transition: transform 0.2s;
}

button:hover {
  transform: scale(1.1) rotate(-2deg);
}

/* SECRET MODE */
.glitch {
  animation: glitch 0.2s infinite;
}

@keyframes glitch {
  0% { transform: translate(0); }
  25% { transform: translate(-2px, 2px); }
  50% { transform: translate(2px, -2px); }
  75% { transform: translate(-2px, -2px); }
  100% { transform: translate(0); }
}
</style>
</head>

<body>

<div class="container" id="card">
  <h1>WELCOME 😈</h1>
  <p>This website is dangerously overpowered.</p>
  <button onclick="activate()">ACTIVATE CHAOS</button>
</div>

<script>
// STARS
for (let i = 0; i < 120; i++) {
  let star = document.createElement("div");
  star.className = "star";
  star.style.left = Math.random() * 100 + "vw";
  star.style.animationDuration = (Math.random() * 5 + 3) + "s";
  star.style.opacity = Math.random();
  document.body.appendChild(star);
}

// BUTTON EVENT
function activate() {
  document.body.style.background = "black";
  document.getElementById("card").classList.add("glitch");
  alert("CHAOS MODE ENABLED 🔥");
}
</script>

</body>
</html>
